name: Build Geek Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5' # 跟你本地保持一致的版本
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 因为大模型说本地没跑通证书校验，加这一步可以强制跳过某些校验
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geek-Keyboard-Release
          path: build/app/outputs/flutter-apk/app-release.apk
